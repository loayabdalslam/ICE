[package]
name = "ice"
version = "0.4.4"
edition = "2021"
description = "ICE — Intent · Compile · Execute agent harness"
license = "Apache-2.0"

[[bin]]
name = "ice"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.86"
crossterm = "=0.27.0"
ratatui = "=0.26.3"
regex = "=1.10.5"
serde_json = "=1.0.117"
unicode-segmentation = "=1.11.0"

unicode-width = "=0.1.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
