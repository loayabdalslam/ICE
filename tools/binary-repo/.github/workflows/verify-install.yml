name: Verify binary installation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Serve this exact checkout (Unix)
        if: runner.os != 'Windows'
        run: python3 -m http.server 8876 --bind 127.0.0.1 > "$RUNNER_TEMP/ice-http.log" 2>&1 &
      - name: Serve this exact checkout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process python -ArgumentList '-m','http.server','8876','--bind','127.0.0.1' -WindowStyle Hidden
      - name: Install and execute (Unix)
        if: runner.os != 'Windows'
        env:
          ICE_BASE_URL: http://127.0.0.1:8876
        run: |
          for n in 1 2 3 4 5; do curl -fsS "$ICE_BASE_URL/LATEST" && break || sleep 1; done
          bash install.sh --bin-dir "$RUNNER_TEMP/ice-bin" --no-path
          "$RUNNER_TEMP/ice-bin/ice" --version
          mkdir -p "$RUNNER_TEMP/ice-workspace"
          "$RUNNER_TEMP/ice-bin/ice" --demo --cwd "$RUNNER_TEMP/ice-workspace" -p "inspect scratch workspace" --max-turns 2
      - name: Install and execute (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($n=0; $n -lt 5; $n++) {
            try { Invoke-WebRequest http://127.0.0.1:8876/LATEST | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          ./install.ps1 -BaseUrl http://127.0.0.1:8876 -InstallDir "$env:RUNNER_TEMP/ice-bin" -NoPath
          & "$env:RUNNER_TEMP/ice-bin/ice.exe" --version
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ice-workspace" | Out-Null
          & "$env:RUNNER_TEMP/ice-bin/ice.exe" --demo --cwd "$env:RUNNER_TEMP/ice-workspace" -p 'inspect scratch workspace' --max-turns 2
